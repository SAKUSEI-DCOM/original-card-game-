<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>豪華影絵演出 プレビュー</title><link rel="stylesheet" href="animated_silhouettes.css"><style>body{margin:0;background:#10101d;color:#f6f3ff;font:16px system-ui,sans-serif}main{max-width:950px;margin:auto;padding:24px 16px}h1{font-size:clamp(23px,4vw,36px)}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}button,select{background:#292747;border:1px solid #867bc4;border-radius:9px;color:#fff;padding:12px;font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #ffd786}.stage{min-height:290px;display:flex;align-items:center;justify-content:center;border-radius:20px;background:#080912;border:2px solid #51466b;padding:10px}.stage svg{width:100%;max-height:none}.timeline{display:grid;gap:7px;margin:15px 0}.timeline label{display:flex;justify-content:space-between}.timeline input{width:100%;accent-color:#c9a6ff}.timeline span{font-size:12px;color:#bdb5d5}.note{color:#c6c1d5;line-height:1.7}a{color:#bce7ff}</style></head><body><main><h1>豪華演出・影絵アニメーション プレビュー</h1><p class="note">12種類のキャラクター影絵を個別に確認できます。カード効果は実行しません。</p><div class="controls"><label for="fx">カード：</label><select id="fx"><option value="究極拳巫女パンチ">究極拳巫女パンチ</option>
<option value="眠気があってちゃんと良かったなぽ">眠気があってちゃんと良かったなぽ</option>
<option value="必殺ファン●ション">必殺ファン●ション</option>
<option value="春風と木音">春風と木音</option>
<option value="やかましいわ">やかましいわ</option>
<option value="癒し系アイドル">癒し系アイドル</option>
<option value="ピカ犬">ピカ犬</option>
<option value="タイダル・ウィンド">タイダル・ウィンド</option>
<option value="コールドスリープ">コールドスリープ</option>
<option value="ドラゴン•エール">ドラゴン•エール</option>
<option value="電脳世界ハリケーン">電脳世界ハリケーン</option>
<option value="怪異">怪異</option></select><button id="replay">最初から再生</button><button id="pause" aria-pressed="false">一時停止</button><button id="stepback" title="1秒戻す">−1秒</button><button id="stepforward" title="1秒進める">＋1秒</button><label for="speed">速度：</label><select id="speed"><option value="1">標準</option><option value=".5">2倍速</option><option value="2">0.5倍速</option></select></div><div class="timeline"><label for="seek">再生位置 <output id="clock">0.0秒</output></label><input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="演出の再生位置"><span id="length">8秒</span></div><div id="stage" class="stage" aria-live="polite"></div><p id="desc" class="note"></p><p class="note">ゲーム本体：<a href="index.html">BOT対戦</a> ／ <a href="online.html">オンラインロビー</a></p></main><script src="animated_silhouettes.js"></script><script>const stage=document.querySelector('#stage'),fx=document.querySelector('#fx'),pause=document.querySelector('#pause'),speed=document.querySelector('#speed'),seek=document.querySelector('#seek'),clock=document.querySelector('#clock'),length=document.querySelector('#length');
const descriptions={'必殺ファン●ション':'ロボットが腕部砲を構え、青白い必殺ビームを発射。シマエナガも登場。','怪異':'8人の人影が時間差で文鳥へ変わる恐怖影絵。','ピカ犬':'水色のポメラニアンが跳ねて尻尾を振る。'};
const durations={'怪異':7.5,'必殺ファン●ション':6};
let elapsed=0,playing=true,last=0,rate=1;
function duration(){return durations[fx.value]||8}
function updateTime(){const d=duration();seek.value=Math.round(elapsed/d*1000);clock.textContent=elapsed.toFixed(1)+'秒';length.textContent=d+'秒 / ループ'}
function renderAt(){
  const svg=stage.querySelector('svg');if(!svg)return;
  svg.querySelectorAll('*').forEach(n=>{
    const cs=getComputedStyle(n);
    if(cs.animationName==='none')return;
    const names=cs.animationName.split(',').map(x=>x.trim());
    const durations=cs.animationDuration.split(',').map(x=>parseFloat(x)||0);
    const delays=cs.animationDelay.split(',').map(x=>parseFloat(x)||0);
    n.style.animationDelay=names.map((_,i)=>((delays[i]??delays[0]??0)-elapsed)+'s').join(',');
    n.style.animationPlayState='paused';
  });
  svg.classList.add('is-paused');
}
function draw(){renderMovingSilhouettes(stage,fx.value);renderAt();updateTime();document.querySelector('#desc').textContent=descriptions[fx.value]||fx.value+' の専用影絵演出'}
function toggle(){playing=!playing;pause.textContent=playing?'一時停止':'再開';pause.setAttribute('aria-pressed',String(!playing));last=0}
function tick(t){if(playing&&last){elapsed=(elapsed+(t-last)/1000*rate)%duration();draw()}last=t;requestAnimationFrame(tick)}
fx.addEventListener('change',()=>{elapsed=0;draw()});
document.querySelector('#replay').addEventListener('click',()=>{elapsed=0;playing=true;pause.textContent='一時停止';pause.setAttribute('aria-pressed','false');draw()});
pause.addEventListener('click',toggle);
speed.addEventListener('change',()=>{rate=1/Number(speed.value);last=0});
seek.addEventListener('input',()=>{elapsed=duration()*Number(seek.value)/1000;draw()});
document.querySelector('#stepback').addEventListener('click',()=>{elapsed=Math.max(0,elapsed-1);draw()});
document.querySelector('#stepforward').addEventListener('click',()=>{elapsed=Math.min(duration(),elapsed+1);draw()});
document.addEventListener('keydown',e=>{if(['SELECT','INPUT','BUTTON'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='ArrowRight'){elapsed=Math.min(duration(),elapsed+1);draw()}if(e.code==='ArrowLeft'){elapsed=Math.max(0,elapsed-1);draw()}});
if(matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;pause.textContent='再開';pause.setAttribute('aria-pressed','true')}
draw();requestAnimationFrame(tick);
</script></body></html>
