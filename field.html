<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オンライン対戦フィールド</title><style>body{margin:0;padding:14px;background:#101a30;color:#f5f8ff;font-family:system-ui}main{max-width:1000px;margin:auto}a{color:#a7d3ff}.panel{padding:14px;background:#1c2a46;border-radius:12px;margin:10px 0}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{width:155px;min-height:110px;text-align:left;background:linear-gradient(130deg,#faf7ff,#cbdcff);color:#17213c;border:2px solid #9ab4d7;border-radius:10px;padding:9px;cursor:pointer}.card:disabled{opacity:.55;cursor:default}button{border:0;border-radius:8px;padding:10px;margin:5px;background:#78b8ff;color:#07172b;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}#log{white-space:pre-wrap;max-height:240px;overflow:auto;font-size:13px}#status{color:#ffe3a0}input,select{padding:10px;border-radius:8px}small{color:#d3dcef}#choose button{display:block;width:100%;text-align:left}
#hauntOverlay{position:fixed;inset:0;z-index:900;background:radial-gradient(circle at 50% 40%,#312453 0%,#080a18 65%);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}#hauntOverlay[hidden]{display:none}#hauntBox{max-width:540px;width:100%;text-align:center;padding:25px;border:2px solid #bba6e8;border-radius:22px;box-shadow:0 0 80px #9254d366;background:linear-gradient(160deg,#17132b,#2c2045);animation:ghostIn .65s ease-out}#hauntBox h2{color:#fce3ab;font-size:clamp(24px,6vw,40px);margin:10px 0}#hauntBox p{line-height:1.7}#hauntIcon{font-size:68px;filter:drop-shadow(0 0 18px #d9aaff);animation:floatGhost 2s ease-in-out infinite}#hauntCards{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}#hauntCards span{display:inline-block;border:1px solid #c8b4ee;border-radius:10px;padding:12px;background:#41365d}#hauntClose{background:#e8ce8e}@keyframes ghostIn{from{opacity:0;transform:scale(.72) rotate(-3deg)}to{opacity:1;transform:scale(1)}}@keyframes floatGhost{50%{transform:translateY(-12px)}}@media(prefers-reduced-motion:reduce){#hauntBox,#hauntIcon{animation:none}}
</style><link rel="stylesheet" href="animated_silhouettes.css"></head><body><main><p><a href="online.html">← ロビー</a>　<span id="roomInfo"></span></p><h1>⚔ 対戦フィールド <small>開発版</small></h1><p style='font-size:12px;color:#f7c98d'>注意：Firebase通信は試作仕様です。相手の手札・山札の秘匿と不正操作防止は未実装のため、一般公開用には使用しないでください。</p><p id="status"></p><div id="lobby" class="panel" hidden><h2>対戦準備</h2><p id="players"></p><p>デッキは20枚です。オンライン未対応のカードを含む場合は開始できません。</p><button id="ready">準備完了</button></div><div id="battle" hidden><section class="panel"><h2 id="enemy">相手</h2><p id="enemyStats"></p></section><section class="panel"><h2 id="self">あなた</h2><p id="selfStats"></p><h3>手札（カードをタップで使用）</h3><div id="hand" class="cards"></div><div id="choose"></div><button id="attack">手札の先頭2枚でUSED攻撃</button><button id="end">ターン終了</button></section><section class="panel"><h3>対戦ログ</h3><div id="log"></div></section></div><div id="hauntOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="hauntTitle"><div id="hauntBox"><div id="hauntIcon">👻</div><h2 id="hauntTitle"></h2><p id="hauntDetail"></p><div id="hauntCards"></div><button id="hauntClose">演出を閉じる</button></div></div><section id="demoPanel" class="panel" hidden><button id="restart">新しいデモ対戦</button><button id="auto">デモを1戦自動進行</button><p id="demoResult"></p></section></main><script src="online_cards.js"></script><script src="online_engine.js"></script><script type="module">
let initializeApp,getFirestore,doc,onSnapshot,runTransaction;
const E=window.OnlineEngine,$=id=>document.getElementById(id),params=new URLSearchParams(location.search),demo=params.has('demo'),code=params.get('room'),seat=Number(params.get('seat')||0);let state=null,room=null,ref=null,db=null,busy=false,lastFxKey='',lastFxSeq=0,fxQueue=[],fxShowing=false;const setStatus=x=>$('status').textContent=x;
function showFxNext(){if(fxShowing||!fxQueue.length)return;fxShowing=true;const f=fxQueue.shift(),overlay=$('hauntOverlay');$('hauntTitle').textContent=f.type==='haunt'?f.title:f.type==='haunt-reveal'?'怪異との遭遇…':'怪奇現象は起こらなかった';$('hauntIcon').textContent=f.type==='haunt'?'👻':f.type==='haunt-reveal'?'⛩️':'🌫️';$('hauntDetail').textContent=f.type==='haunt'?`${f.card}（${f.color}）から怪奇現象が発生！`:f.type==='haunt-reveal'?'山札の上から2枚を公開。区分が異なれば怪異を選べます。':f.reason||'条件不成立';$('hauntCards').replaceChildren();for(const c of f.cards||[]){const el=document.createElement('span');el.textContent=`${c.name} ／ ${c.pair}`;$('hauntCards').append(el)}overlay.hidden=false;$('hauntClose').focus()}
function closeFx(){if(!fxShowing)return;$('hauntOverlay').hidden=true;fxShowing=false;showFxNext()}
$('hauntClose').onclick=closeFx;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&fxShowing)closeFx()});
function collectFx(g){if(g.fxEvents?.length){for(const f of g.fxEvents){if(f.seq<=lastFxSeq)continue;fxQueue.push(f);lastFxSeq=f.seq}showFxNext();return}const f=g?.fx;if(!f)return;const key=`${g.round}:${f.id}:${f.type}:${f.who}`;if(key===lastFxKey)return;lastFxKey=key;fxQueue.push(f);showFxNext()}
function names(){try{let x=JSON.parse(localStorage.getItem('ocbSharedDeckV1')||'null');if(x?.cards)return x.cards}catch{}return E.demoDeck()}
let luxurySeqSeen=null,luxuryQueue=[],luxuryActive=false;
function collectLuxury(g){
 const events=g.luxuryEvents||[];
 // Existing events on room entry are historical, not a new animation.
 if(luxurySeqSeen===null){luxurySeqSeen=g.luxurySeq||0;return}
 for(const event of events){if(event.seq>luxurySeqSeen)luxuryQueue.push(event)}
 luxurySeqSeen=Math.max(luxurySeqSeen,g.luxurySeq||0);
 playNextLuxury();
}
function playNextLuxury(){
 if(luxuryActive||!luxuryQueue.length)return;
 const event=luxuryQueue.shift();
 if(!window.hasOnlineLuxuryFx?.(event.name)){playNextLuxury();return}
 luxuryActive=true;
 window.showOnlineLuxuryFx?.(event.name,()=>{luxuryActive=false;playNextLuxury();if(!luxuryActive)render()});
}
function render(){if(!state)return;collectFx(state);collectLuxury(state);$('battle').hidden=false;$('lobby').hidden=true;let me=state.players[seat],other=state.players[1-seat],mine=state.turn===seat&&!state.over,can=mine&&!luxuryActive&&!luxuryQueue.length&&!state.acted&&!state.pending;
$('self').textContent='あなた（'+(seat+1)+'P）';$('enemy').textContent='相手（'+(2-seat)+'P）';$('selfStats').textContent=`ライフ ${me.life} ／ 山札 ${me.deck.length} ／ USED ${me.used.length} ／ ${me.asleep?'睡眠':me.sleepy?'眠気':'通常'}${me.cold?'（ダメージ無効）':''}`;$('enemyStats').textContent=`ライフ ${other.life} ／ 手札 ${other.hand.length} ／ 山札 ${other.deck.length} ／ USED ${other.used.length} ／ ${other.asleep?'睡眠':other.sleepy?'眠気':'通常'}`;
$('hand').replaceChildren();me.hand.forEach((id,i)=>{let c=E.CARDS[id],b=document.createElement('button');b.className='card';b.textContent=c[0]+'\n'+c[1];b.style.whiteSpace='pre-line';b.disabled=c[2]==='gamingjuice'||!can||me.asleep&&!['mugi','coldsleep','ambassador'].includes(c[2]);b.onclick=()=>action({type:'play',index:i});$('hand').append(b)});$('choose').replaceChildren();if(state.pending?.type==='juice'&&state.pending.who===seat){let label=document.createElement('p');label.textContent='ゲーミングジュースを捨てて相手に眠気を付与しますか？';$('choose').append(label);for(const [txt,yes] of [['発動する',true],['発動しない',false]]){let b=document.createElement('button');b.textContent=txt;b.onclick=()=>action({type:'react',accept:yes});$('choose').append(b)}}if(state.pending?.type==='miko'&&state.pending.who===seat){let p=document.createElement('p');p.textContent='逸般巫女：怪奇現象を発動するカードを選択';$('choose').append(p);state.pending.cards.forEach((id,i)=>{let b=document.createElement('button');b.textContent=E.CARDS[id][0]+'（'+E.colorPair(id)+'）';b.onclick=()=>action({type:'choose',index:i});$('choose').append(b)})}
$('attack').disabled=!can||me.asleep||me.hand.length<2;$('end').disabled=!mine||luxuryActive||luxuryQueue.length||!!state.pending;$('log').textContent=state.log.slice(-30).join('\n');setStatus(state.over?'対戦終了：'+(state.winner===seat?'あなたの勝利！':'相手の勝利'):mine?'あなたのターン':'相手のターンを待っています');}
function action(a){if(busy||luxuryActive||luxuryQueue.length)return;busy=true;if(demo){try{state=E.apply(state,seat,a);render();if(!state.over&&(state.turn!==seat||state.pending?.who!==seat))bot()}catch(e){setStatus(e.message)}finally{busy=false}return}runTransaction(db,async tx=>{let snap=await tx.get(ref);if(!snap.exists())throw Error('ルームがありません');let data=snap.data();if(data.status!=='playing')throw Error('対戦は開始していません');if(data.players?.[seat]?.token!==sessionStorage.getItem('ocbPlayerToken'))throw Error('この席の操作権限がありません');let next=E.apply(data.game,seat,a);tx.update(ref,{game:next,updatedAt:Date.now(),status:next.over?'finished':'playing'})}).catch(e=>setStatus('操作失敗：'+e.message)).finally(()=>busy=false)}
$('end').onclick=()=>action({type:'end'});$('attack').onclick=()=>action({type:'attack',indices:[0,1]});
function bot(){let guard=0;while(!state.over&&(state.turn!==seat||state.pending?.who===1-seat)&&guard++<6){if(state.pending){if(state.pending.who===1-seat){state=E.apply(state,1-seat,state.pending.type==='juice'?{type:'react',accept:true}:{type:'choose',index:0});continue}break}let bot=state.players[1-seat],index=bot.hand.findIndex(id=>E.supported.has(E.CARDS[id][2])&&(!bot.asleep||['mugi','coldsleep','ambassador'].includes(E.CARDS[id][2]))&&!(E.CARDS[id][2]==='chitose'&&bot.hand.length<4));try{if(!state.acted&&index>=0)state=E.apply(state,1-seat,{type:'play',index});if(state.pending)state=E.apply(state,state.pending.who,state.pending.type==='juice'?{type:'react',accept:true}:{type:'choose',index:0});if(!state.over&&!state.pending)state=E.apply(state,1-seat,{type:'end'})}catch(e){setStatus(e.message);break}}render()}
function restart(){state=E.start([E.makeDeck(E.demoDeck()),E.makeDeck(E.demoDeck())]);render();if(state.turn!==seat)bot()}
$('restart').onclick=()=>{if(!luxuryActive)restart()};$('auto').onclick=()=>{if(luxuryActive)return;let rounds=0;while(!state.over&&rounds++<250){let who=state.turn,p=state.players[who],idx=p.hand.findIndex(id=>E.supported.has(E.CARDS[id][2])&&(!p.asleep||['mugi','coldsleep','ambassador'].includes(E.CARDS[id][2])));try{if(!state.acted&&idx>=0)state=E.apply(state,who,{type:'play',index:idx});if(state.pending)state=E.apply(state,state.pending.who,state.pending.type==='juice'?{type:'react',accept:true}:{type:'choose',index:0});if(!state.over)state=E.apply(state,who,{type:'end'})}catch(e){setStatus(e.message);break}}$('demoResult').textContent='自動進行 '+rounds+'ターン／勝者：'+(state.winner===null?'未決着':(state.winner+1)+'P');render()};
if(demo){$('roomInfo').textContent='通信なしデモ';$('demoPanel').hidden=false;restart()}else{try{if(!/^\d{6}$/.test(code)||![0,1].includes(seat))throw Error('ルーム情報が不正です');let c=JSON.parse(localStorage.getItem('ocbFirebaseConfigV1')||'null');if(!c)throw Error('Firebase設定がありません');({initializeApp}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'));({getFirestore,doc,onSnapshot,runTransaction}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js'));db=getFirestore(initializeApp(c,'ocb-field-'+c.projectId));ref=doc(db,'ocbRooms',code);$('roomInfo').textContent='ルーム番号 '+code;$('lobby').hidden=false;onSnapshot(ref,snap=>{if(!snap.exists()){setStatus('ルームが見つかりません');return}room=snap.data();if(room.players?.[seat]?.token!==sessionStorage.getItem('ocbPlayerToken')){setStatus('この席の参加者ではありません');$('battle').hidden=true;return}$('players').textContent=(room.players||[]).map((p,i)=>`${i+1}P：${p.name} ${p.ready?'準備完了':''}`).join(' ／ ');$('ready').disabled=!!room.players?.[seat]?.ready;if(room.game){state=room.game;render()}else setStatus('2人の準備完了を待っています')},e=>setStatus('同期エラー：'+e.message));$('ready').onclick=async()=>{try{let deck=E.makeDeck(names());await runTransaction(db,async tx=>{let snap=await tx.get(ref);let data=snap.data();if(!data||data.status!=='waiting')throw Error('開始できません');let ps=[...data.players];if(!ps[seat]||ps[seat].token!==sessionStorage.getItem('ocbPlayerToken'))throw Error('この席の操作権限がありません');ps[seat]={...ps[seat],ready:true,deck};let patch={players:ps,updatedAt:Date.now()};if(ps.length===2&&ps.every(p=>p.ready)){patch.game=E.start(ps.map(p=>p.deck));patch.status='playing'}tx.update(ref,patch)});}catch(e){setStatus('準備失敗：'+e.message)}}}catch(e){setStatus(e.message)}}
</script><style>#onlineLuxury{position:fixed;inset:0;z-index:1100;background:radial-gradient(circle,#322453,#080b19);display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#fff;padding:25px}#onlineLuxury.active{display:flex}#onlineLuxury.kaii-mode{background:radial-gradient(circle,#343439,#050505)}#onlineLuxury.kaii-mode .sil{animation:kaiiOnline 6s steps(6,end) forwards}@keyframes kaiiOnline{0%{filter:brightness(0);transform:scale(1.5)}50%{filter:brightness(0) drop-shadow(0 0 12px white);transform:scale(1)}100%{filter:brightness(0) drop-shadow(0 0 25px white);transform:scale(.75)}}#onlineLuxury .sil{font-size:clamp(110px,28vw,230px);filter:brightness(0) drop-shadow(0 0 30px #c1a1ff);animation:floatSil 2s infinite alternate}#onlineLuxury h2{color:#ffe5a1;font-size:clamp(22px,5vw,42px)}@keyframes floatSil{to{transform:translateY(-25px);filter:brightness(0) drop-shadow(0 0 60px #ffe8b4)}}#onlineLuxury p{max-width:550px;line-height:1.8}#onlineLuxury button{background:#ffe5a1}</style><div id="onlineLuxury"><div id="onlineMovingScene"></div><div class="sil" id="onlineLuxurySil" style="display:none"></div><h2 id="onlineLuxuryName"></h2><p id="onlineLuxuryText"></p><span class="cinema-wait" aria-live="polite">演出終了後、自動的に対戦へ戻ります</span></div><script src="animated_silhouettes.js"></script><script>window.FX_ONLINE_NAMES=['究極拳巫女パンチ','眠気があってちゃんと良かったなぽ','必殺ファン●ション','春風と木音','やかましいわ','癒し系アイドル','ピカ犬','タイダル・ウィンド','コールドスリープ','ドラゴン•エール','電脳世界ハリケーン','怪異'];const onlineSymbols=['⛩️','🐍','🤖','🌸','🎧','🎤','🐕','🌊','☁️','🐉','🎮','🐦'];const onlineDescriptions=['星空の神社に巫女と二人の女性の影が現れる。','白蛇と守護者が結界を広げる。','シマエナガが見守る中、ロボットが青白い必殺ビームを放つ。','春風と撫子と木魚の響き。','路地裏に暗いビートが響く。','紫のライトにアイドルと宝石の音符。','水色のポメラニアンが尻尾を振る。','砂浜に古本屋が立つ。','ピンクのバクが夢の雲を漂う。','角の生えた少女が歌う。','ゲーム・リボン・ハートのシールが舞う。','人々の影が一体ずつ変化し、最後は無数の文鳥の影だけが残る。'];let onlineLuxuryTimer,onlineLuxuryDone=null;window.closeOnlineLuxuryFx=()=>{clearTimeout(onlineLuxuryTimer);document.getElementById('onlineLuxury').classList.remove('active','kaii-mode');const cb=onlineLuxuryDone;onlineLuxuryDone=null;if(cb)cb();if(typeof render==='function')render()};window.hasOnlineLuxuryFx=name=>{let p={};try{p=JSON.parse(localStorage.getItem('ocbProgressV139')||'{}')}catch{}return !!p.fxOwned?.includes(name)&&p.fxEnabled?.[name]!==false};window.showOnlineLuxuryFx=(name,onDone)=>{let p={};try{p=JSON.parse(localStorage.getItem('ocbProgressV139')||'{}')}catch{}if(!p.fxOwned?.includes(name)||p.fxEnabled?.[name]===false){onDone?.();return}const i=window.FX_ONLINE_NAMES.indexOf(name);if(i<0){onDone?.();return}onlineLuxuryDone=onDone||null;window.renderMovingSilhouettes?.(document.getElementById('onlineMovingScene'),name);document.getElementById('onlineLuxuryName').textContent=name;document.getElementById('onlineLuxuryText').textContent=onlineDescriptions[i];document.getElementById('onlineLuxury').classList.toggle('kaii-mode',name==='怪異');document.getElementById('onlineLuxury').classList.add('active');clearTimeout(onlineLuxuryTimer);onlineLuxuryTimer=setTimeout(window.closeOnlineLuxuryFx,name==='怪異'?8500:8000)};</script></body></html>
