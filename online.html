<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オンライン対戦ロビー</title><style>body{font-family:system-ui;background:#11172b;color:#fff;margin:0;padding:20px}main{max-width:650px;margin:auto}section{background:#202c48;border-radius:15px;padding:18px;margin:14px 0}input,textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:11px;margin:6px 0;border-radius:8px}button{background:#75b5ff;border:0;cursor:pointer;font-weight:bold}input,textarea{background:#f9fafb;color:#111}small{color:#c7d2e5}a{color:#a8d2ff}#status{white-space:pre-wrap}</style></head><body><main><h1>🌐 オンライン対戦ロビー</h1><p><a href="index.html">← ホームへ戻る</a></p><section><h2>Firebase設定</h2><small>Firebaseコンソールの「プロジェクトの設定 → ウェブアプリ」から設定JSONを貼り付けます。このブラウザに保存されます。Firestoreを有効化してください。</small><textarea id="config" rows="7" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","appId":"..."}'></textarea><button id="save">設定を保存</button></section><section><h2>オンライン対戦</h2><input id="nickname" maxlength="20" placeholder="表示名（例：プレイヤー1）"><button id="create">6桁ルームを作成</button><input id="room" maxlength="6" inputmode="numeric" placeholder="6桁ルーム番号"><button id="join">ルームに参加</button><p id="status" role="status"></p></section><section><h2>通信なしデモ</h2><p>Firebase接続不要で、同じルール処理を使ったBOT対戦を繰り返せます。</p><button onclick="location.href='field.html?demo=1'">デモ対戦を開始</button></section><small>注意：このオンライン版は一部カード効果のみ対応した試作版です。未対応カードはデッキ登録時に拒否します。Firestoreルールは本番公開前に認証・操作検証を追加してください。</small></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getFirestore,doc,getDoc,setDoc,runTransaction,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const $=id=>document.getElementById(id),key='ocbFirebaseConfigV1';$('config').value=localStorage.getItem(key)||'';$('save').onclick=()=>{try{let x=JSON.parse($('config').value);if(!x.apiKey||!x.projectId||!x.appId)throw Error('必須項目がありません');localStorage.setItem(key,JSON.stringify(x));$('status').textContent='設定を保存しました'}catch(e){$('status').textContent=e.message}};
function db(){const c=JSON.parse(localStorage.getItem(key)||'null');if(!c)throw Error('先にFirebase設定を保存してください');return getFirestore(initializeApp(c,'ocb-'+c.projectId))}
function token(){let t=sessionStorage.getItem('ocbPlayerToken');if(!t){t=crypto.randomUUID();sessionStorage.setItem('ocbPlayerToken',t)}return t}
function nick(){return $('nickname').value.trim().slice(0,20)||'プレイヤー'}
$('create').onclick=async()=>{try{let d=db(),code;for(let n=0;n<10;n++){code=String(Math.floor(100000+Math.random()*900000));let ref=doc(d,'ocbRooms',code);let success=await runTransaction(d,async tx=>{let snap=await tx.get(ref);if(snap.exists())return false;tx.set(ref,{createdAt:Date.now(),status:'waiting',players:[{token:token(),name:nick(),ready:false}],game:null,updatedAt:Date.now()});return true});if(success){location.href='field.html?room='+code+'&seat=0';return}}throw Error('ルーム作成に失敗しました')}catch(e){$('status').textContent=e.message}};
$('join').onclick=async()=>{try{let code=$('room').value.trim();if(!/^\d{6}$/.test(code))throw Error('6桁の番号を入力してください');let d=db(),ref=doc(d,'ocbRooms',code),seat=await runTransaction(d,async tx=>{let snap=await tx.get(ref);if(!snap.exists())throw Error('ルームが見つかりません');let data=snap.data(),ps=data.players||[];let found=ps.findIndex(x=>x.token===token());if(found>=0)return found;if(ps.length>=2||data.status!=='waiting')throw Error('満員または対戦開始済みです');tx.update(ref,{players:[...ps,{token:token(),name:nick(),ready:false}],updatedAt:Date.now()});return 1});location.href='field.html?room='+code+'&seat='+seat}catch(e){$('status').textContent=e.message}};
</script></body></html>
