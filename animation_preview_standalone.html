    n.style.animationPlayState='paused';
  });
  svg.classList.add('is-paused');
}
function draw(){renderMovingSilhouettes(stage,fx.value);renderAt();updateTime();document.querySelector('#desc').textContent=descriptions[fx.value]||fx.value+' の専用影絵演出'}
function toggle(){playing=!playing;pause.textContent=playing?'一時停止':'再開';pause.setAttribute('aria-pressed',String(!playing));last=0}
function tick(t){if(playing&&last){elapsed=(elapsed+(t-last)/1000*rate)%duration();draw()}last=t;requestAnimationFrame(tick)}
fx.addEventListener('change',()=>{elapsed=0;draw()});
document.querySelector('#replay').addEventListener('click',()=>{elapsed=0;playing=true;pause.textContent='一時停止';pause.setAttribute('aria-pressed','false');draw()});
pause.addEventListener('click',toggle);
speed.addEventListener('change',()=>{rate=1/Number(speed.value);last=0});
seek.addEventListener('input',()=>{elapsed=duration()*Number(seek.value)/1000;draw()});
document.querySelector('#stepback').addEventListener('click',()=>{elapsed=Math.max(0,elapsed-1);draw()});
document.querySelector('#stepforward').addEventListener('click',()=>{elapsed=Math.min(duration(),elapsed+1);draw()});
document.addEventListener('keydown',e=>{if(['SELECT','INPUT','BUTTON'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='ArrowRight'){elapsed=Math.min(duration(),elapsed+1);draw()}if(e.code==='ArrowLeft'){elapsed=Math.max(0,elapsed-1);draw()}});
if(matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;pause.textContent='再開';pause.setAttribute('aria-pressed','true')}
draw();requestAnimationFrame(tick);
</script></body></html>
